name: Build CM27 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check project ZIP exists
        run: test -f CM27_ANDROID_PROJECT.zip

      - name: Extract project ZIP
        run: unzip -q CM27_ANDROID_PROJECT.zip -d cm27src

      - name: Install dependencies and prepare Android
        working-directory: cm27src
        run: |
          npm install
          npm run copy-web
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: cm27src/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CM27-debug-APK
          path: cm27src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: normal
